openapi: 3.1.0
info:
  title: Receipts API
  version: 0.1.0
  description: >
    Public API and internal Go <-> agent API for Receipts.
    Only /healthz exists until Phase 4 Task 1.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
